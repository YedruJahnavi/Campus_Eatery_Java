<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Campus Eatery</title>
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
    <div class="app-container">
        <nav class="navbar">
            <div class="nav-inner">
                <a href="index.html" class="nav-brand">
                    <span class="brand-mark"><ion-icon name="restaurant"></ion-icon></span>
                    Campus Eatery
                </a>
                <div class="nav-links"></div>
            </div>
        </nav>

        <main class="main-content">
            <div class="page-head">
                <div>
                    <h1 class="page-title text-gradient">Complete Your Order</h1>
                    <p class="page-sub">Delivering right to your hostel or classroom.</p>
                </div>
            </div>

            <!-- Success Screen -->
            <div id="checkoutSuccess" class="glass-panel success-screen" style="display: none;">
                <div class="success-icon"><ion-icon name="checkmark"></ion-icon></div>
                <h2>Order Placed Successfully!</h2>
                <p>Your order has been sent to the stall. Track it live from your vendor dashboard.</p>
                <div class="success-order-id">Order ID: <strong id="successOrderId"></strong></div>
                <div>
                    <a href="index.html" class="btn btn-dark">Back to Home</a>
                </div>
            </div>

            <!-- Checkout Form -->
            <div id="checkoutFormContainer">
                <form id="addressForm">
                    <div class="checkout-grid">
                        <div class="glass-panel checkout-card">
                            <h3 class="checkout-section-title">
                                <span class="step-dot">1</span> Delivery Address
                            </h3>
                            <div class="form-group">
                                <label class="form-label" for="addressLine1">Hostel / Building Name</label>
                                <input type="text" id="addressLine1" class="form-control" placeholder="e.g. Boys Hostel A" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="addressLine2">Room No / specific details</label>
                                <input type="text" id="addressLine2" class="form-control" placeholder="e.g. Room 204">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label" for="city">City / Campus Area</label>
                                    <input type="text" id="city" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="pincode">Pincode</label>
                                    <input type="text" id="pincode" class="form-control" required>
                                </div>
                            </div>
                        </div>

                        <div class="glass-panel checkout-card">
                            <h3 class="checkout-section-title">
                                <span class="step-dot">2</span> Order Summary
                            </h3>
                            <div id="checkoutSummary" class="summary-lines">
                                <p class="text-secondary text-center">Loading cart...</p>
                            </div>
                            <button type="submit" class="btn btn-dark btn-block btn-lg" id="placeOrderBtn">
                                <ion-icon name="card-outline"></ion-icon> Place Order
                            </button>
                            <p id="checkoutError" class="text-error text-center" style="margin-top: 1rem; display: none;"></p>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
