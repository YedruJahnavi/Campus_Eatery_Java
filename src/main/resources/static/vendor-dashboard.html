<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Eatery | Vendor Portal</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .order-card {
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            background: var(--white);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--gray-100);
            padding-bottom: 1rem;
        }
        .status-select {
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid var(--gray-300);
            background: var(--gray-100);
            font-family: inherit;
        }
    </style>
</head>
<body style="background-color: var(--gray-100);">

    <nav class="navbar" style="background-color: var(--black); color: var(--white);">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div class="logo"><a href="/index.html"><img src="/images/logo.png" alt="Campus Eatery" style="height: 40px; display: block;"></a></div>
            <div class="nav-links">
                <div id="user-button" style="display: none;"></div>
            </div>
        </div>
    </nav>

    <main class="container" style="padding: 4rem 2rem;">
        <h1 style="font-size: 2.5rem; margin-bottom: 2rem;">Manage Orders</h1>
        
        <div id="vendor-orders-container">
            <p style="color: var(--gray-500);">Loading incoming orders...</p>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let authChecked = false;
            const checkAuth = setInterval(() => {
                if (window.Clerk && window.Clerk.isReady) {
                    clearInterval(checkAuth);
                    
                    window.Clerk.addListener(({ user }) => {
                        if (authChecked) return;
                        authChecked = true;
                        
                        if (user) {
                            loadVendorOrders();
                        } else {
                            document.getElementById('vendor-orders-container').innerHTML = '<p>Session expired. Redirecting to login...</p>';
                            setTimeout(() => {
                                window.location.href = '/index.html?login=true';
                            }, 1500);
                        }
                    });
                    
                    // Fallback
                    setTimeout(() => {
                        if (!authChecked) {
                            authChecked = true;
                            if (window.Clerk.user) {
                                loadVendorOrders();
                            } else {
                                window.location.href = '/index.html?login=true';
                            }
                        }
                    }, 500);
                }
            }, 100);
        });

        async function loadVendorOrders() {
            const container = document.getElementById('vendor-orders-container');
            try {
                const orders = await window.api.getVendorOrders();
                
                if (orders.length === 0) {
                    container.innerHTML = '<div style="text-align: center; padding: 4rem; background: var(--white); border-radius: var(--radius-lg);"><span style="font-size: 3rem;">😴</span><p style="color: var(--text-muted); margin-top: 1rem;">No orders yet. Waiting for hungry students...</p></div>';
                    return;
                }
                
                const pendingOrders = orders.filter(o => o.status === 'PENDING' || o.status === 'ACCEPTED');
                const preparingOrders = orders.filter(o => o.status === 'PREPARING');
                const readyOrders = orders.filter(o => o.status === 'READY_FOR_PICKUP');
                
                const renderCard = (order) => {
                    const date = new Date(order.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    return `
                        <div class="order-card" style="box-shadow: var(--shadow-sm);">
                            <div class="order-header">
                                <div>
                                    <strong style="display: block; font-size: 1.1rem;">#${order.id.substring(0, 5).toUpperCase()}</strong>
                                    <span style="font-size: 0.85rem; color: var(--text-muted);">${date}</span>
                                </div>
                                <span style="font-weight: bold; color: var(--primary);">₹${order.totalAmount.toFixed(2)}</span>
                            </div>
                            <ul style="list-style: none; padding: 0; margin-bottom: 1rem;">
                                ${order.items.map(item => `
                                    <li style="display: flex; justify-content: space-between; padding: 0.25rem 0; color: var(--text-main); font-size: 0.95rem;">
                                        <span><span style="font-weight: bold; margin-right: 0.5rem;">${item.quantity}x</span> ${item.name}</span>
                                    </li>
                                `).join('')}
                            </ul>
                            <div style="border-top: 1px solid var(--border); padding-top: 1rem;">
                                <select class="status-select" style="width: 100%; padding: 0.75rem; border-radius: var(--radius-md);" onchange="updateStatus('${order.id}', this.value)">
                                    <option value="PENDING" ${order.status === 'PENDING' ? 'selected' : ''}>Pending</option>
                                    <option value="ACCEPTED" ${order.status === 'ACCEPTED' ? 'selected' : ''}>Accepted</option>
                                    <option value="PREPARING" ${order.status === 'PREPARING' ? 'selected' : ''}>Preparing</option>
                                    <option value="READY_FOR_PICKUP" ${order.status === 'READY_FOR_PICKUP' ? 'selected' : ''}>Ready for Pickup</option>
                                    <option value="COMPLETED" ${order.status === 'COMPLETED' ? 'selected' : ''}>Completed</option>
                                    <option value="CANCELLED" ${order.status === 'CANCELLED' ? 'selected' : ''}>Cancelled</option>
                                </select>
                            </div>
                        </div>
                    `;
                };

                let html = `
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;">
                        <!-- Incoming Column -->
                        <div style="background: var(--gray-50); padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border);">
                            <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
                                <span>📥 Incoming</span>
                                <span style="background: var(--primary); color: white; border-radius: var(--radius-full); width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.9rem;">${pendingOrders.length}</span>
                            </h3>
                            ${pendingOrders.length ? pendingOrders.map(renderCard).join('') : '<p style="color: var(--text-muted); text-align: center; padding: 2rem 0;">No incoming orders</p>'}
                        </div>
                        
                        <!-- Preparing Column -->
                        <div style="background: var(--gray-50); padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border);">
                            <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
                                <span>🍳 Preparing</span>
                                <span style="background: var(--warning); color: white; border-radius: var(--radius-full); width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.9rem;">${preparingOrders.length}</span>
                            </h3>
                            ${preparingOrders.length ? preparingOrders.map(renderCard).join('') : '<p style="color: var(--text-muted); text-align: center; padding: 2rem 0;">No orders in preparation</p>'}
                        </div>
                        
                        <!-- Ready Column -->
                        <div style="background: var(--gray-50); padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border);">
                            <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
                                <span>🛍️ Ready</span>
                                <span style="background: var(--success); color: white; border-radius: var(--radius-full); width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.9rem;">${readyOrders.length}</span>
                            </h3>
                            ${readyOrders.length ? readyOrders.map(renderCard).join('') : '<p style="color: var(--text-muted); text-align: center; padding: 2rem 0;">No orders ready for pickup</p>'}
                        </div>
                    </div>
                `;

                
                container.innerHTML = html;
            } catch (error) {
                if (error.message.includes('403')) {
                    container.innerHTML = `<p style="color: red;">Access Denied. Your account does not have Vendor privileges.</p>`;
                } else {
                    container.innerHTML = `<p style="color: red;">Failed to load orders: ${error.message}</p>`;
                }
            }
        }

        async function updateStatus(orderId, newStatus) {
            try {
                await window.api.updateOrderStatus(orderId, newStatus);
                // Optionally show a toast or alert
            } catch (err) {
                alert(`Failed to update status: ${err.message}`);
                loadVendorOrders(); // reload to revert select box
            }
        }
    </script>
</body>
</html>
