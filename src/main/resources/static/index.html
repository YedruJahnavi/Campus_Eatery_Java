<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Eatery | Premium Dining Experience</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Ionicons for modern icons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Navigation -->
        <nav class="navbar">
            <a href="#" class="nav-brand text-gradient">Campus Eatery</a>
            <div class="nav-links">
                <a href="#" class="nav-link"><ion-icon name="restaurant-outline"></ion-icon> Vendors</a>
                <a href="#" class="nav-link" id="cartToggleBtn"><ion-icon name="cart-outline"></ion-icon> Cart</a>
                <button class="btn btn-primary" id="loginBtn">Sign In</button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content" id="appRoot">
            <section class="hero-section">
                <h1 class="hero-title">Delicious Campus Food, <br><span class="text-gradient">Delivered Fast.</span></h1>
                <p class="hero-subtitle">Skip the lines. Order from your favorite campus stalls and enjoy seamless delivery right to your hostel or classroom.</p>
                <div style="display: flex; gap: 1rem; justify-content: center;">
                    <button class="btn btn-primary" id="exploreBtn">Explore Menu</button>
                    <button class="btn btn-glass" id="vendorBtn" onclick="window.location.href='dashboard.html'">Vendor Dashboard</button>
                </div>
            </section>

            <!-- Dynamic content will be injected here by app.js -->
            <section id="dynamicContent">
                <div class="vendor-grid" id="vendorList">
                    <!-- Loaded via JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Cart Sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>Your Order</h2>
            <button class="close-btn" id="closeCartBtn"><ion-icon name="close-outline"></ion-icon></button>
        </div>
        <div class="cart-items" id="cartItemsContainer">
            <!-- Loaded via JS -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total</span>
                <span id="cartTotalValue">₹0.00</span>
            </div>
            <button class="btn btn-primary" style="width: 100%;" id="checkoutBtn">Proceed to Checkout</button>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
