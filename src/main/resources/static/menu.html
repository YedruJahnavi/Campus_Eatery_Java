<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Eatery | Menu</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .menu-item-card {
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s ease;
        }
        .menu-item-card:hover {
            border-color: var(--black);
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--black);
            color: var(--white);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div class="logo"><a href="/vendors.html"><img src="/images/logo.png" alt="Campus Eatery" style="height: 40px; display: block;"></a></div>
            <div class="nav-links" style="display: flex; align-items: center; gap: 1.5rem;">
                <a href="/dashboard.html" style="font-weight: 600;">Dashboard</a>
                <a href="/cart.html" style="font-weight: 600;">Cart &rarr;</a>
                <div id="user-button" style="display: none;"></div>
            </div>
        </div>
    </nav>

    <main>
        <!-- Vendor Cover & Info -->
        <div id="vendor-cover" style="height: 250px; background: linear-gradient(135deg, var(--gray-200), var(--gray-300)); position: relative;">
            <div class="container" style="position: absolute; bottom: -40px; left: 0; right: 0; display: flex; gap: 1.5rem; align-items: flex-end;">
                <div id="vendor-logo" style="width: 120px; height: 120px; border-radius: var(--radius-lg); background: var(--surface); border: 4px solid var(--surface); box-shadow: var(--shadow-md); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; color: var(--primary);">V</div>
            </div>
        </div>
        
        <div class="container" style="padding-top: 5rem; padding-bottom: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem;">
                <div>
                    <h1 id="vendor-name" style="font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem;">Loading...</h1>
                    <p id="vendor-desc" style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 1rem;"></p>
                    <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                        <span style="background: var(--success); color: white; padding: 0.25rem 0.75rem; border-radius: var(--radius-full); font-weight: 600; font-size: 0.9rem;">Open Now</span>
                        <span style="color: var(--text-muted); font-size: 0.9rem;">📍 <span id="vendor-location">Campus</span></span>
                        <span style="color: var(--text-muted); font-size: 0.9rem;">⏱️ 15-20 min</span>
                        <div id="vendor-reviews" style="display: flex; gap: 0.5rem; align-items: center;">
                            <span style="background: var(--text-main); color: var(--white); padding: 0.2rem 0.6rem; border-radius: 4px; font-weight: bold; font-size: 0.85rem;">⭐ <span id="vendor-rating">--</span></span>
                            <span style="color: var(--text-muted); font-size: 0.85rem;" id="vendor-review-count">(0 reviews)</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: 200px 1fr; gap: 3rem;">
                <!-- Categories Sidebar -->
                <aside style="position: sticky; top: 100px; height: fit-content;">
                    <h3 style="font-size: 1.25rem; margin-bottom: 1rem;">Menu</h3>
                    <nav style="display: flex; flex-direction: column; gap: 0.5rem;">
                        <a href="#recommended" style="padding: 0.5rem 1rem; border-left: 3px solid var(--primary); font-weight: 600; color: var(--primary);">Recommended</a>
                        <a href="#meals" style="padding: 0.5rem 1rem; border-left: 3px solid transparent; color: var(--text-muted);">Meals</a>
                        <a href="#snacks" style="padding: 0.5rem 1rem; border-left: 3px solid transparent; color: var(--text-muted);">Snacks</a>
                        <a href="#drinks" style="padding: 0.5rem 1rem; border-left: 3px solid transparent; color: var(--text-muted);">Drinks</a>
                    </nav>
                </aside>
                
                <!-- Menu Grid -->
                <div id="menu-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem;">
                    <p style="color: var(--text-muted);">Loading menu items...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Sticky Cart Banner (Swiggy style) -->
    <div id="sticky-cart-banner" style="position: fixed; bottom: 0; left: 0; width: 100%; background: var(--black); color: var(--white); padding: 1rem; display: flex; justify-content: space-between; align-items: center; z-index: 1000; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin: 0 auto;">
            <div>
                <span id="cart-item-count" style="font-weight: bold; margin-right: 0.5rem;">1 ITEM</span>
                <span style="opacity: 0.5;">|</span>
                <span id="cart-total" style="margin-left: 0.5rem; font-weight: bold;">₹0.00</span>
            </div>
            <a href="/cart.html" style="color: var(--white); font-weight: bold; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; text-transform: uppercase; font-size: 0.9rem;">
                View Cart <span style="font-size: 1.2rem;">&rarr;</span>
            </a>
        </div>
    </div>
    </main>

    <div id="toast" class="toast">Item added to cart!</div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        let isAuthReady = false;

        document.addEventListener('DOMContentLoaded', () => {
            const checkSession = setInterval(() => {
                if (window.Clerk && window.Clerk.isReady) {
                    clearInterval(checkSession);
                    isAuthReady = true;
                }
            }, 100);

            const urlParams = new URLSearchParams(window.location.search);
            const vendorId = urlParams.get('vendorId');

            if (!vendorId) {
                document.getElementById('vendor-name').innerText = 'Vendor Not Found';
                document.getElementById('menu-grid').innerHTML = '<p>No vendor ID provided.</p>';
                return;
            }

            loadMenu(vendorId);
        });

        async function loadMenu(vendorId) {
            try {
                const data = await window.api.getVendorById(vendorId);
                const vendor = data.stall || data || {};
                const menuItems = vendor.menuItems || data.menuItems || [];
                
                document.getElementById('vendor-name').innerText = vendor.name || 'Vendor Menu';
                document.getElementById('vendor-desc').innerText = vendor.description || '';
                document.getElementById('vendor-location').innerText = vendor.collegeLocation || 'Campus Area';
                document.getElementById('vendor-logo').innerText = vendor.name ? vendor.name.substring(0, 1).toUpperCase() : 'V';

                // Load reviews concurrently
                loadReviews(vendorId);

                if (menuItems.length === 0) {
                    document.getElementById('menu-grid').innerHTML = '<p style="color: var(--gray-500);">This vendor has no menu items listed yet.</p>';
                    return;
                }
                
                let html = '';
                menuItems.forEach(item => {
                    const price = item.pricePaise ? (item.pricePaise / 100).toFixed(2) : '0.00';
                    html += `
                        <div class="menu-item-card">
                            <div>
                                <h3 style="font-size: 1.25rem; margin-bottom: 0.25rem;">${item.name}</h3>
                                <p style="color: var(--gray-500); font-size: 0.9rem; margin-bottom: 0.5rem;">${item.description || ''}</p>
                                <span style="font-weight: 600;">₹${price}</span>
                            </div>
                            <button onclick="addToCart('${item.id}')" class="btn-primary" style="padding: 0.5rem 1rem;">Add</button>
                        </div>
                    `;
                });
                document.getElementById('menu-grid').innerHTML = html;
            } catch (err) {
                document.getElementById('menu-grid').innerHTML = `<p style="color: red;">Error loading menu: ${err.message}</p>`;
            }
        }

        async function addToCart(itemId) {
            if (!isAuthReady || !window.Clerk.user) {
                window.Clerk.openSignIn();
                return;
            }
            try {
                await window.api.addCartItem(itemId, 1);
                showToast();
                updateCartBanner();
            } catch (err) {
                alert(`Failed to add to cart: ${err.message}`);
            }
        }

        async function updateCartBanner() {
            if (!window.Clerk.user) return;
            try {
                const data = await window.api.getCart();
                const cart = data.cart || data;
                const items = cart.items || [];
                
                if (items.length > 0) {
                    const totalQty = items.reduce((sum, item) => sum + item.quantity, 0);
                    const totalAmt = items.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                    
                    document.getElementById('cart-item-count').innerText = `${totalQty} ITEM${totalQty > 1 ? 'S' : ''}`;
                    document.getElementById('cart-total').innerText = `₹${totalAmt.toFixed(2)}`;
                    document.getElementById('sticky-cart-banner').style.transform = 'translateY(0)';
                }
            } catch (e) {
                console.error("Failed to update cart banner", e);
            }
        }

        async function loadReviews(vendorId) {
            try {
                const reviews = await window.api.getStallReviews(vendorId);
                if (reviews && reviews.length > 0) {
                    const avg = reviews.reduce((sum, r) => sum + r.rating, 0) / reviews.length;
                    document.getElementById('vendor-rating').innerText = avg.toFixed(1);
                    document.getElementById('vendor-review-count').innerText = `(${reviews.length} reviews)`;
                }
            } catch (e) {
                console.error("Failed to load reviews", e);
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
