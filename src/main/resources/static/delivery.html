<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Eatery | Delivery Agent Dashboard</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body style="background-color: var(--gray-50);">

    <nav class="navbar" style="background-color: var(--black); color: var(--white);">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div class="logo">
                <a href="/index.html"><img src="/images/logo.png" alt="Campus Eatery" style="height: 40px; display: block;"></a>
            </div>
            <div style="font-weight: 600; color: var(--primary);">Rider Portal</div>
            <div class="nav-links">
                <div id="user-button" style="display: none;"></div>
            </div>
        </div>
    </nav>

    <main class="container" style="padding: 3rem 2rem; max-width: 1000px; margin: 0 auto;">
        <h1 style="font-size: 2.5rem; margin-bottom: 2rem; font-weight: 800;">Delivery Dashboard</h1>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
            
            <!-- Available Orders to Pickup -->
            <div style="background: var(--surface); padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
                <h3 style="margin-bottom: 1.5rem; font-size: 1.5rem; border-bottom: 2px solid var(--gray-200); padding-bottom: 0.5rem;">📍 Available to Pickup</h3>
                <div id="available-deliveries-container">
                    <p style="color: var(--text-muted);">Loading available deliveries...</p>
                </div>
            </div>
            
            <!-- My Active Deliveries -->
            <div style="background: var(--surface); padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
                <h3 style="margin-bottom: 1.5rem; font-size: 1.5rem; border-bottom: 2px solid var(--gray-200); padding-bottom: 0.5rem;">🛵 My Deliveries</h3>
                <div id="my-deliveries-container">
                    <p style="color: var(--text-muted);">Loading your deliveries...</p>
                </div>
            </div>
            
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkSession = setInterval(async () => {
                if (window.Clerk && window.Clerk.isReady) {
                    clearInterval(checkSession);
                    if (window.Clerk.user) {
                        loadDeliveries();
                        setInterval(loadDeliveries, 15000); // Poll every 15s
                    } else {
                        window.location.href = '/index.html?login=true';
                    }
                }
            }, 100);
        });

        async function loadDeliveries() {
            await Promise.all([loadAvailableDeliveries(), loadMyDeliveries()]);
        }

        async function loadAvailableDeliveries() {
            const container = document.getElementById('available-deliveries-container');
            try {
                const orders = await window.api.getAvailableDeliveries();
                if (!orders || orders.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 2rem 0;">No new orders ready for pickup.</p>';
                    return;
                }
                
                let html = '<div style="display: flex; flex-direction: column; gap: 1rem;">';
                orders.forEach(order => {
                    const date = new Date(order.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    html += `
                        <div style="border: 1px solid var(--border); padding: 1.5rem; border-radius: var(--radius-md); background: var(--gray-50);">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                                <strong>Order #${order.id.substring(0,5).toUpperCase()}</strong>
                                <span style="font-size: 0.85rem; color: var(--text-muted);">${date}</span>
                            </div>
                            <p style="font-size: 0.9rem; margin-bottom: 1rem;">Pickup from Stall ID: ${order.stallId.substring(0,8)}</p>
                            <button onclick="acceptDelivery('${order.id}')" class="btn-primary" style="width: 100%; padding: 0.75rem;">Accept Delivery</button>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p style="color: var(--error);">Error: ${err.message}</p>`;
            }
        }

        async function loadMyDeliveries() {
            const container = document.getElementById('my-deliveries-container');
            try {
                let orders = await window.api.getMyDeliveries();
                orders = orders.filter(o => o.status !== 'COMPLETED' && o.status !== 'DELIVERED');
                
                if (!orders || orders.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 2rem 0;">You have no active deliveries.</p>';
                    return;
                }
                
                let html = '<div style="display: flex; flex-direction: column; gap: 1rem;">';
                orders.forEach(order => {
                    html += `
                        <div style="border: 1px solid var(--primary); padding: 1.5rem; border-radius: var(--radius-md); background: var(--white); box-shadow: var(--shadow-sm);">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                                <strong>Order #${order.id.substring(0,5).toUpperCase()}</strong>
                                <span style="background: var(--warning); color: white; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.8rem;">${order.status}</span>
                            </div>
                            <p style="font-size: 0.9rem; margin-bottom: 0.5rem;">Deliver to Address ID: ${order.deliveryAddressId.substring(0,8)}</p>
                            
                            <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed var(--border);">
                                <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">Student Delivery Code:</label>
                                <div style="display: flex; gap: 0.5rem;">
                                    <input type="text" id="code-${order.id}" placeholder="Enter 4-digit code" style="flex: 1; padding: 0.5rem; border: 1px solid var(--border); border-radius: var(--radius-sm);">
                                    <button onclick="completeDelivery('${order.id}')" style="background: var(--success); color: white; border: none; padding: 0.5rem 1rem; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600;">Complete</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p style="color: var(--error);">Error: ${err.message}</p>`;
            }
        }

        async function acceptDelivery(orderId) {
            try {
                await window.api.acceptDelivery(orderId);
                loadDeliveries();
            } catch (err) {
                alert(`Failed to accept: ${err.message}`);
            }
        }

        async function completeDelivery(orderId) {
            const codeInput = document.getElementById(`code-${orderId}`);
            if (!codeInput || !codeInput.value) {
                alert("Please enter the delivery code from the student.");
                return;
            }
            try {
                await window.api.completeDelivery(orderId, codeInput.value);
                alert("Delivery Completed!");
                loadDeliveries();
            } catch (err) {
                alert(`Failed to complete: ${err.message}`);
            }
        }
    </script>
</body>
</html>
