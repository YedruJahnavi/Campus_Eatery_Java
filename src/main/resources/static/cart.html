<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Eatery | Cart</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--gray-200);
        }
        .qty-btn {
            background: var(--gray-100);
            border: 1px solid var(--gray-300);
            border-radius: 4px;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
        }
        .qty-btn:hover {
            background: var(--gray-200);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div class="logo"><a href="/index.html"><img src="/images/logo.png" alt="Campus Eatery" style="height: 40px; display: block;"></a></div>
            <div class="nav-links">
                <a href="/dashboard.html">Dashboard</a>
                <div id="user-button" style="display: none;"></div>
            </div>
        </div>
    </nav>

    <main class="container" style="padding: 4rem 2rem; max-width: 800px;">
        <h1 style="font-size: 2.5rem; margin-bottom: 2rem;">Your Cart</h1>
        
        <div id="cart-container" class="glass-card" style="border: 1px solid var(--gray-200); padding: 2rem; border-radius: 12px; background: var(--gray-100);">
            <p style="color: var(--gray-500);">Loading cart...</p>
        </div>
        
        <div id="checkout-section" style="margin-top: 2rem; text-align: right; display: none;">
            <h3 id="cart-total" style="font-size: 1.5rem; margin-bottom: 1rem;">Total: ₹0.00</h3>
            <button id="checkout-btn" class="btn-primary" style="font-size: 1.1rem; padding: 1rem 2rem; width: 100%; max-width: 300px;">Checkout</button>
        </div>
    </main>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let authChecked = false;
            const checkAuth = setInterval(() => {
                if (window.Clerk && window.Clerk.isReady) {
                    clearInterval(checkAuth);
                    
                    // Add listener to handle session state changes correctly
                    window.Clerk.addListener(({ user }) => {
                        if (authChecked) return;
                        authChecked = true;
                        
                        if (user) {
                            loadCart();
                        } else {
                            document.getElementById('cart-container').innerHTML = '<p>Session expired. Redirecting to login...</p>';
                            setTimeout(() => {
                                window.location.href = '/index.html?login=true';
                            }, 1500);
                        }
                    });
                    
                    // Fallback in case listener doesn't trigger immediately
                    setTimeout(() => {
                        if (!authChecked) {
                            authChecked = true;
                            if (window.Clerk.user) {
                                loadCart();
                            } else {
                                window.location.href = '/index.html?login=true';
                            }
                        }
                    }, 500);
                }
            }, 100);
            
            document.getElementById('checkout-btn').addEventListener('click', async () => {
                try {
                    const btn = document.getElementById('checkout-btn');
                    btn.disabled = true;
                    btn.innerText = 'Processing...';
                    
                    // 1. Call backend to create Razorpay order
                    const orderData = await window.api.createRazorpayOrder();
                    
                    // 2. Open Razorpay modal
                    const options = {
                        "key": orderData.key,
                        "amount": orderData.amount,
                        "currency": orderData.currency,
                        "name": "Campus Eatery",
                        "description": "Food Order Checkout",
                        "order_id": orderData.order_id,
                        "handler": async function (response) {
                            try {
                                // 3. Verify payment signature on backend
                                await window.api.verifyRazorpayPayment({
                                    razorpay_payment_id: response.razorpay_payment_id,
                                    razorpay_order_id: response.razorpay_order_id,
                                    razorpay_signature: response.razorpay_signature,
                                    local_order_id: orderData.local_order_id
                                });
                                alert('Payment successful! Order placed.');
                                window.location.href = '/dashboard.html';
                            } catch (err) {
                                alert(`Verification failed: ${err.message}`);
                                btn.disabled = false;
                                btn.innerText = 'Checkout';
                            }
                        },
                        "modal": {
                            "ondismiss": function() {
                                btn.disabled = false;
                                btn.innerText = 'Checkout';
                            }
                        },
                        "theme": {
                            "color": "#eab308"
                        }
                    };
                    const rzp = new window.Razorpay(options);
                    rzp.on('payment.failed', function (response) {
                        alert(`Payment failed: ${response.error.description}`);
                        btn.disabled = false;
                        btn.innerText = 'Checkout';
                    });
                    rzp.open();
                    
                } catch (err) {
                    alert(`Checkout failed: ${err.message}`);
                    document.getElementById('checkout-btn').disabled = false;
                    document.getElementById('checkout-btn').innerText = 'Checkout';
                }
            });
        });

        async function loadCart() {
            const container = document.getElementById('cart-container');
            const checkoutSection = document.getElementById('checkout-section');
            
            try {
                const cart = await window.api.getCart();
                const items = cart.items || [];
                
                if (items.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 4rem 0;">
                            <div style="font-size: 4rem; margin-bottom: 1rem;">🛒</div>
                            <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Your cart is empty</h2>
                            <p style="color: var(--text-muted); margin-bottom: 2rem;">Looks like you haven't added anything to your cart yet.</p>
                            <a href="/vendors.html" class="btn-primary">Browse Eateries</a>
                        </div>
                    `;
                    checkoutSection.style.display = 'none';
                    return;
                }
                
                let html = '';
                let subtotal = 0;
                const deliveryFee = 20.00; // Fixed delivery fee for now
                
                items.forEach(item => {
                    const price = item.price ? (item.price / 100) : 0;
                    subtotal += price * item.quantity;
                    
                    html += `
                        <div class="cart-item">
                            <div>
                                <h4 style="font-size: 1.1rem; margin-bottom: 0.25rem;">${item.name || 'Menu Item'}</h4>
                                <span style="font-weight: 600; color: var(--text-main);">₹${price.toFixed(2)}</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 1.5rem;">
                                <div style="display: flex; align-items: center; gap: 0.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-full); padding: 0.25rem;">
                                    <button class="qty-btn" style="border-radius: var(--radius-full); border: none; background: transparent; width: 28px; height: 28px;" onclick="updateQty('${item.menuItemId}', 'decrement')">-</button>
                                    <span style="width: 20px; text-align: center; font-weight: 600;">${item.quantity}</span>
                                    <button class="qty-btn" style="border-radius: var(--radius-full); border: none; background: var(--gray-100); width: 28px; height: 28px;" onclick="updateQty('${item.menuItemId}', 'increment')">+</button>
                                </div>
                                <button onclick="removeItem('${item.menuItemId}')" style="background: none; border: none; color: var(--error); cursor: pointer; font-size: 1.2rem;" title="Remove item">🗑️</button>
                            </div>
                        </div>
                    `;
                });
                
                const total = subtotal + deliveryFee;
                
                html += `
                    <div style="margin-top: 2rem; border-top: 1px dashed var(--border); padding-top: 1.5rem;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; color: var(--text-muted);">
                            <span>Subtotal</span>
                            <span>₹${subtotal.toFixed(2)}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; color: var(--text-muted);">
                            <span>Delivery Fee</span>
                            <span>₹${deliveryFee.toFixed(2)}</span>
                        </div>
                    </div>
                `;
                
                container.innerHTML = html;
                document.getElementById('cart-total').innerText = `Total: ₹${total.toFixed(2)}`;
                checkoutSection.style.display = 'block';
            } catch (error) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 2rem; color: var(--error);">
                        <p>⚠️ Failed to load cart</p>
                        <p style="font-size: 0.9rem; margin-top: 0.5rem;">${error.message}</p>
                        <button onclick="loadCart()" class="btn-primary" style="margin-top: 1rem;">Retry</button>
                    </div>
                `;
                checkoutSection.style.display = 'none';
            }
        }

        async function updateQty(itemId, action) {
            try {
                await window.api.updateCartItem(itemId, action);
                loadCart();
            } catch (err) {
                alert(`Update failed: ${err.message}`);
            }
        }
        
        async function removeItem(itemId) {
            try {
                await window.api.removeCartItem(itemId);
                loadCart();
            } catch (err) {
                alert(`Remove failed: ${err.message}`);
            }
        }
    </script>
</body>
</html>
