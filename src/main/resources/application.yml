spring:
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/campus_eatery}
      database: campus_eatery
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CLERK_ISSUER_URI:}

clerk:
  publishable-key: ${CLERK_PUBLISHABLE_KEY:}
  frontend-api: ${CLERK_FRONTEND_API:}

server:
  port: ${PORT:8080}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
